<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100">
  <defs>
    <linearGradient id="ep-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Agent Action -->
  <rect x="4" y="30" width="100" height="40" rx="8" fill="#0c1929" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="54" y="55" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#e5e7eb">Agent Action</text>

  <!-- Arrow 1 -->
  <line x1="108" y1="50" x2="128" y2="50" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="128,46 136,50 128,54" fill="#38bdf8"/>

  <!-- SpendLimit -->
  <rect x="140" y="30" width="96" height="40" rx="8" fill="#0c1929" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="188" y="48" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#38bdf8">Spend</text>
  <text x="188" y="60" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#38bdf8">Limit</text>

  <!-- Arrow 2 -->
  <line x1="240" y1="50" x2="256" y2="50" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="256,46 264,50 256,54" fill="#38bdf8"/>

  <!-- TimeWindow -->
  <rect x="268" y="30" width="96" height="40" rx="8" fill="#0c1929" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="316" y="48" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#38bdf8">Time</text>
  <text x="316" y="60" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#38bdf8">Window</text>

  <!-- Arrow 3 -->
  <line x1="368" y1="50" x2="384" y2="50" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="384,46 392,50 384,54" fill="#38bdf8"/>

  <!-- AllowedTargets -->
  <rect x="396" y="30" width="96" height="40" rx="8" fill="#0c1929" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="444" y="48" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#38bdf8">Allowed</text>
  <text x="444" y="60" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#38bdf8">Targets</text>

  <!-- Arrow 4 -->
  <line x1="496" y1="50" x2="512" y2="50" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="512,46 520,50 512,54" fill="#38bdf8"/>

  <!-- AllowedMethods -->
  <rect x="524" y="30" width="96" height="40" rx="8" fill="#0c1929" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="572" y="48" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#38bdf8">Allowed</text>
  <text x="572" y="60" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#38bdf8">Methods</text>

  <!-- Arrow 5 -->
  <line x1="624" y1="50" x2="640" y2="50" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="640,46 648,50 640,54" fill="#38bdf8"/>

  <!-- Nonce -->
  <rect x="652" y="30" width="60" height="40" rx="8" fill="#0c1929" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="682" y="55" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#38bdf8">Nonce</text>

  <!-- Arrow 6 -->
  <line x1="716" y1="50" x2="732" y2="50" stroke="#27ae60" stroke-width="1.5"/>
  <polygon points="732,46 740,50 732,54" fill="#27ae60"/>

  <!-- Execute + Receipt -->
  <rect x="744" y="30" width="52" height="40" rx="8" fill="#0c1929" stroke="#27ae60" stroke-width="1.5"/>
  <text x="770" y="48" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600" fill="#27ae60">Execute</text>
  <text x="770" y="60" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="600" fill="#27ae60">+ Receipt</text>

  <!-- Labels -->
  <text x="54" y="86" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#64748b">EIP-7702</text>
  <text x="400" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">On-chain caveat enforcers — cannot be bypassed</text>
</svg>
