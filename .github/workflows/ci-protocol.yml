name: CI — Protocol

on:
  push:
    branches: [main]
    paths:
      - 'protocol/**'
      - '.github/workflows/ci-protocol.yml'
  pull_request:
    branches: [main]
    paths:
      - 'protocol/**'
      - '.github/workflows/ci-protocol.yml'

jobs:
  contracts:
    name: Foundry Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build --sizes

      - name: Unit & integration tests
        run: forge test --no-match-path "test/fuzz/*" --no-match-path "test/invariants/*"

      - name: Fuzz tests (CI profile — 10k runs)
        env:
          FOUNDRY_PROFILE: ci
        run: forge test --match-path "test/fuzz/*"

      - name: Invariant tests (CI profile — 10k runs)
        env:
          FOUNDRY_PROFILE: ci
        run: forge test --match-path "test/invariants/*"

  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Coverage (80% threshold)
        run: |
          COVERAGE=$(forge coverage --ir-minimum --report summary 2>&1 | grep -E "^Lines:" | awk '{print $NF}' | tr -d '%')
          echo "Line coverage: ${COVERAGE}%"
          if [ -n "$COVERAGE" ] && (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi

  lint:
    name: Solidity Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check

  sdk:
    name: Protocol SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @irsb/sdk build
      - run: pnpm --filter @irsb/sdk typecheck || true
