name: CI — Agents

on:
  push:
    branches: [main]
    paths:
      - 'services/agents/**'
      - '.github/workflows/ci-agents.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/agents/**'
      - '.github/workflows/ci-agents.yml'

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Lint
        run: |
          pip install ruff
          ruff check .
