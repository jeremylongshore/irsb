name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: irsb-protocol
  REGION: us-central1
  SERVICE_NAME: irsb-agent-passkey
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/irsb-protocol/irsb-containers

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    # Required for WIF
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/308207955734/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc
          service_account: github-actions-deploy@irsb-protocol.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --set-secrets="LIT_AUTH_PRIVATE_KEY=lit-auth-private-key:latest,LIT_PKP_PUBLIC_KEY=lit-pkp-public-key:latest,CAPABILITY_SECRET=capability-secret:latest" \
            --set-env-vars="NODE_ENV=production,LIT_NETWORK=datil-dev,LOG_LEVEL=info" \
            --quiet

      - name: Show Service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "Service deployed to: $URL"
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Service URL: $URL" >> $GITHUB_STEP_SUMMARY
