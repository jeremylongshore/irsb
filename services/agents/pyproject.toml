[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irsb-agents"
version = "0.2.0"
description = "IRSB Money Agent + Builder Agent — RAG-grounded protocol intelligence"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Intent Solutions", email = "dev@intent-solutions.io"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # RAG pipeline
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-chroma>=0.2.0",
    "chromadb>=0.5.0",

    # Document loaders
    "pypdf>=4.0.0",

    # Local LLM
    "langchain-ollama>=0.2.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",

    # On-chain reader
    "web3>=7.0.0",

    # Formal verification
    "z3-solver>=4.12.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "psutil>=6.0.0",
    "gitpython>=3.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
vertex = ["google-cloud-aiplatform>=1.74.0"]
all = ["irsb-agents[anthropic,vertex]"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
include = ["shared*", "builder*", "money*", "api*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
